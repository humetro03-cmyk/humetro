<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>스마트 역무 마스터</title>

  <link rel="icon" type="image/png" href="./icon.png">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0056a0; /* 배경을 파란색으로 통일하여 여백 이질감 제거 */
    }
    body {
      display: flex;
      flex-direction: column;
      padding-top: 0 !important;
    }
    #appFrame {
      width: 100%;
      flex: 1;
      border: none;
      display: block;
      background-color: #ffffff;
    }
  </style>
</head>
<body>
  <iframe id="appFrame" src="https://script.google.com/macros/s/AKfycbz4Dd25pWumoWp_30y2QFcyG08CxZX-5kTIp_PB_GcXreRxsrNaTGXfWQBJwr9kjyqy/exec" allow="fullscreen; camera; microphone; geolocation"></iframe>
