<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>스마트 역무 마스터</title>
  
  <!-- 안드로이드 / iOS 앱 설치 설정 -->
  <link rel="manifest" href="./manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="스마트 역무 마스터">
  <link rel="apple-touch-icon" href="./icon.png">
  <link rel="apple-touch-icon-precomposed" href="./icon.png">
  <link rel="icon" type="image/png" href="./icon.png">
  <link rel="shortcut icon" href="./icon.png">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ffffff;
    }
    body {
      display: flex;
      flex-direction: column;
      /* 노치 및 다이내믹 아일랜드 영역만큼 정확히 내려줌 */
      padding-top: max(44px, env(safe-area-inset-top));
    }
    #appFrame {
      width: 100%;
      flex: 1;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <iframe id="appFrame" src="https://script.google.com/macros/s/AKfycbz4Dd25pWumoWp_30y2QFcyG08CxZX-5kTIp_PB_GcXreRxsrNaTGXfWQBJwr9kjyqy/exec" allow="fullscreen; camera; microphone; geolocation"></iframe>
</body>
</html>
