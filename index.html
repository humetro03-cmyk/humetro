<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>스마트 역무 마스터</title>

  <link rel="manifest" href="./manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="스마트 역무 마스터">
    <link rel="apple-touch-icon" href="./icon-180.png">
    <link rel="apple-touch-icon-precomposed" href="./icon-180.png">
    <link rel="icon" type="image/png" href="./icon-192.png">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0056a0; /* 배경을 파란색으로 통일하여 여백 이질감 제거 */
    }
    body {
      display: flex;
      flex-direction: column;
      padding-top: 0 !important;
    }
    #appFrame {
      width: 100%;
      flex: 1;
      border: none;
      display: block;
      background-color: #ffffff;
    }
  </style>
</head>
<body>
  <iframe id="appFrame" allow="fullscreen; camera; microphone; geolocation"></iframe>

  <!-- 앱 주소 구성: 이 기기 고유값(dev) + 래퍼 버전(wv) + 초대 링크(cal)를 붙여서 앱을 불러옴 -->
  <script>
  (function () {
    var BASE = 'https://script.google.com/macros/s/AKfycbz4Dd25pWumoWp_30y2QFcyG08CxZX-5kTIp_PB_GcXreRxsrNaTGXfWQBJwr9kjyqy/exec';
    var frame = document.getElementById('appFrame');
    var q = ['wv=3'];

    // 1) 이 기기(홈 화면 앱) 고유값: 처음 한 번 만들어 이 페이지 저장소에 보관
    try {
      var dev = localStorage.getItem('HM_DEV');
      if (!dev || !/^[A-Za-z0-9]{16,40}$/.test(dev)) {
        var chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789';
        var r = new Uint8Array(28), s = '', i;
        (window.crypto || window.msCrypto).getRandomValues(r);
        for (i = 0; i < r.length; i++) s += chars.charAt(r[i] % chars.length);
        dev = s;
        localStorage.setItem('HM_DEV', dev);
      }
      q.push('dev=' + dev);
    } catch (e) {}

    // 2) 초대 링크(?cal=코드)로 들어오면 코드를 앱 주소에 붙여서 전달
    try {
      var cal = new URLSearchParams(location.search).get('cal');
      if (cal && /^[A-Za-z0-9]{4,12}$/.test(cal)) q.push('cal=' + cal);
    } catch (e) {}

    frame.src = BASE + '?' + q.join('&');

    // 3) 앱이 "내 달력 정보"를 이 페이지 저장소에 보관/조회하도록 중계
    var OK = /^https:\/\/[a-z0-9-]+\.googleusercontent\.com$/;
    window.addEventListener('message', function (ev) {
      var d = ev.data;
      if (!d || d.hm !== 'bridge' || !OK.test(ev.origin)) return;
      var k = String(d.k || '');
      if (k.indexOf('HM_CAL_') !== 0) return;
      try {
        if (d.op === 'set') {
          localStorage.setItem('HMB_' + k, String(d.v));
        } else if (d.op === 'get') {
          ev.source.postMessage({ hm: 'bridgeRes', id: d.id, v: localStorage.getItem('HMB_' + k) }, ev.origin);
        }
      } catch (e) {}
    });

    // 4) 이 페이지가 폰에 오래된 상태로 남지 않도록, 접속할 때마다 최신 본을 다시 받아 저장
    setTimeout(function () {
      try {
        var base = location.pathname.replace(/[^\/]*$/, '');
        fetch(base, { cache: 'reload' }).catch(function () {});
        fetch(base + 'index.html', { cache: 'reload' }).catch(function () {});
      } catch (e) {}
    }, 2000);
  })();
  </script>
</body>
</html>
